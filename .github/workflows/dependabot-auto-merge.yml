name: Dependabot Auto-merge

# `pull_request_target` runs in the base-repo context, so GITHUB_TOKEN keeps write
# scope — a plain `pull_request` run from Dependabot is read-only and cannot enable
# auto-merge. Nothing here checks out or executes PR code, which is what makes
# `pull_request_target` safe to use for this.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Gate on the PR *author*, not `github.actor`. On a `synchronize` push the actor
    # is whoever pushed, so gating on the actor would skip this job entirely when a
    # maintainer pushes to an already-armed Dependabot branch — and GitHub only
    # cancels auto-merge for pushes by users *without* write access, so that
    # maintainer's human-authored commit would ride in on Dependabot's armed merge,
    # bypassing the Copilot review gate. Running on author instead lets the job
    # re-evaluate, and actively cancel, on every update.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Only meaningful when Dependabot itself pushed the head commit: the action
      # reads the bump out of the commit message.
      - name: Fetch Dependabot metadata
        id: metadata
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Patch and minor only. Majors — the dev-toolchain-majors and
      # dev-other-majors groups in dependabot.yml — stay manual: they are the
      # ones that break builds. For a grouped PR, update-type is the highest
      # bump in the group, so a group containing a major is not auto-merged.
      - name: Arm auto-merge for patch and minor bumps
        if: >-
          github.actor == 'dependabot[bot]' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The inverse case: a human pushed to this branch, or a rebase turned the
      # bump into a major. Either way any previously armed auto-merge has to come
      # back off, or it would merge content this workflow never approved.
      - name: Cancel auto-merge on a non-Dependabot push or a major bump
        if: >-
          !(github.actor == 'dependabot[bot]' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'))
        run: |
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            echo "Auto-merge is armed but this update is not an auto-mergeable Dependabot bump; cancelling."
            gh pr merge --disable-auto "$PR_URL"
          else
            echo "Auto-merge is not armed; nothing to cancel."
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
