name: CI

on:
  # No base-branch filter: `pull_request.branches` matches the *base*, so a stacked PR
  # (one targeting another feature branch rather than main) ran only semantic-pr-title
  # and was merged untested. Every PR gets the full suite; push stays main-only so
  # feature branches do not double-run.
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

jobs:
  links:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links in documentation
        uses: lycheeverse/lychee-action@v2
        with:
          # Release-asset "latest download" URLs (e.g. the .mcpb button in README)
          # 404 transiently on a release: this link check runs concurrently with the
          # release workflow, which uploads the asset ~1 min after creating the
          # release. Exclude them — the build-extension job validates the asset.
          args: >-
            --verbose
            --no-progress
            --accept 200,204,301,302,403,429
            --exclude 'localhost'
            --exclude '127.0.0.1'
            --exclude 'x.com/i/communities'
            --exclude 'github.com/.*/compare/.*\.\.\..*'
            --exclude 'github.com/.*/releases/latest/download/.*'
            README.md
            INSTALLATION.md
            CHANGELOG.md
          fail: true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # `prebuild` regenerates the memory-policy artifacts and pegs every
      # <!-- automem-template-version --> marker to package.json. If building dirties the
      # tree, the committed artifacts are stale and a clean developer checkout goes dirty on
      # `npm run build` — exactly the 0.16.0 marker drift that PR #257 had to clean up by
      # hand. Before this guard, CI masked that: the build below runs *before* the tests, so
      # `prebuild` quietly repaired the markers in the runner and the drift assertion in
      # tests/cli/smoke.test.ts passed on a tree that was wrong in git.
      #
      # Safe on a Release Please PR: `extra-files` in release-please-config.json lists every
      # marker-bearing file with the `generic` updater, so the release commit rewrites the
      # markers in the same commit as the package.json bump and `prebuild` finds nothing left
      # to change. A naive version of this guard (added before that wiring existed) would
      # have failed every release PR instead.
      - name: Verify build leaves no uncommitted changes
        run: |
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            echo "::error::npm run build modified the working tree. Run 'npm run build' locally and commit the regenerated files."
            echo "Offending paths:"
            echo "$dirty"
            echo "--- diff ---"
            git --no-pager diff
            exit 1
          fi
          echo "Tree clean after build."

      - name: Build Claude Desktop extension
        run: npm run build:extension

      - name: Verify Claude Desktop extension
        run: npm run test:extension

      - name: Test
        run: npm test

      - name: Test coverage
        run: npm run test:coverage
        continue-on-error: true

      # Headless installer e2e matrix (builds+packs a tarball, runs install/uninstall
      # scenarios against an in-process mock — no docker, no node-pty, no network).
      # Gates the risky write/abort/idempotency paths the unit tests don't reach.
      # Check out the production curl|sh entrypoint (served at automem.ai/install.sh)
      # immediately before the e2e step — NOT at the top — so this external checkout
      # never contaminates lint/build/test scope (`eslint .` / `vitest run` would
      # otherwise traverse automem-website/ and fail on its source).
      - name: Check out automem-website (for the curl|sh install bootstrap)
        uses: actions/checkout@v4
        with:
          repository: verygoodplugins/automem-website
          path: automem-website

      - name: E2E install scenarios
        env:
          # Point the harness at the real production install.sh and REQUIRE it, so the
          # website-bootstrap (curl | sh) scenario can never be silently skipped again.
          # A missing/renamed checkout now fails the build instead of going green-untested.
          AUTOMEM_INSTALL_SH: ${{ github.workspace }}/automem-website/public/install.sh
          AUTOMEM_REQUIRE_INSTALL_SH: '1'
        run: npm run test:e2e

  service-integration:
    name: AutoMem service integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 16389:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      qdrant:
        image: qdrant/qdrant:v1.11.3
        ports:
          - 16339:6333
    env:
      AUTOMEM_TEST_API_URL: http://127.0.0.1:18011
      AUTOMEM_TEST_API_KEY: integration-test-token
      AUTOMEM_REQUIRE_SERVICE: '1'
      AUTOMEM_TEST_VECTOR_SIZE: '1024'
      AUTOMEM_API_TOKEN: integration-test-token
      ADMIN_API_TOKEN: integration-admin-token
      FALKORDB_HOST: 127.0.0.1
      FALKORDB_PORT: '16389'
      FALKORDB_GRAPH: mcp_integration
      QDRANT_URL: http://127.0.0.1:16339
      QDRANT_COLLECTION: mcp_integration
      VECTOR_SIZE: '1024'
      EMBEDDING_PROVIDER: placeholder
      JIT_ENRICHMENT_ENABLED: 'false'
      ENRICHMENT_ENABLE_SUMMARIES: 'false'
      PORT: '18011'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install client dependencies
        run: npm ci
      - name: Check out the service fixture
        uses: actions/checkout@v4
        with:
          repository: verygoodplugins/automem
          # Pin the service contract; update deliberately when integration requirements change.
          ref: 01a17aa38e678924c07a51015ef705b8474e2193
          path: service-fixture
      - name: Install service dependencies
        run: python -m pip install -r service-fixture/requirements.txt
      - name: Start isolated AutoMem service
        working-directory: service-fixture
        run: |
          python app.py > "$RUNNER_TEMP/automem-integration.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/automem-integration.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS "$AUTOMEM_TEST_API_URL/health" | python -c 'import json,sys; sys.exit(json.load(sys.stdin)["status"] != "healthy")'; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/automem-integration.log"
          exit 1
      - name: Require service integration tests without skips
        run: npm run test:integration
      - name: Show service log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/automem-integration.log" || true
      - name: Stop service fixture
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/automem-integration.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/automem-integration.pid")" || true
          fi

  hooks-windows:
    name: Hook commands (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Regression guard for #108: hook commands shipped in templates/plugins
      # must execute via Node child_process (cmd.exe /d /s /c on Windows), the
      # same model Claude Code uses to launch hooks. On Windows there is no
      # parent shell to parse `VAR=value command` prefixes, so the wrapped
      # `bash -c '…'` form is the only one that works. This test fails loudly
      # if the wrap regresses.
      - name: Verify wrapped hook commands run on Windows
        run: npx vitest run tests/installer/hook-commands.test.ts
