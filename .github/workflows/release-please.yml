# Release Please - Automated versioning and npm publishing
#
# How it works:
# 1. Every push to main with conventional commits updates a "Release PR"
# 2. When you merge the Release PR, it:
#    - Updates version in package.json
#    - Updates CHANGELOG.md
#    - Creates a GitHub Release with tag
#    - Triggers the npm publish job below
#
# After a release, the docs-dispatch job asks automem-website to document it
# (docs on automem.ai follow published releases, not every push to main).
#
# Commit message format:
#   feat: add new feature          → minor version bump
#   fix: fix a bug                 → patch version bump
#   feat!: breaking change         → major version bump
#   chore/docs: no version bump
#
# npm Publishing:
#   Uses Trusted Publishing (OIDC) - no secrets needed!
#   Configure at: https://www.npmjs.com/package/@verygoodplugins/mcp-{name}/access
#
# Release PR token:
#   GitHub does not start workflow runs from events caused by GITHUB_TOKEN, so a
#   release PR opened with the default token lands with its checks in
#   `action_required` and has to be approved by hand before the required `test` and
#   `semantic-pr-title` checks can report. Three release PRs in a row stalled on
#   that. RELEASE_PLEASE_TOKEN (an org secret, visible to this repo) is used instead
#   so the PR's checks run on their own. It needs contents:write and
#   pull-requests:write. If the secret is ever absent or expired the expression
#   falls back to github.token, which still opens the PR correctly - it just needs
#   the manual approval again, rather than failing the release outright.

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # See "Release PR token" above: the default github.token would open a
          # release PR whose checks need manual approval.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docs-dispatch:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/docs-dispatch.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  npm-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Trusted Publishing: No NPM_TOKEN needed!
      - run: npm publish --access public --provenance

  # Build and upload Claude Desktop Extension (.mcpb) to release
  build-extension:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci
      - run: npm run build

      # Build the .mcpb Claude Desktop Extension
      - name: Build Claude Desktop Extension
        run: npx @anthropic-ai/mcpb pack

      # Upload .mcpb to the GitHub release
      - name: Upload Extension to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: '*.mcpb'
