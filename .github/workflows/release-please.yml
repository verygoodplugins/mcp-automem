# Release Please - Automated versioning and npm publishing
#
# How it works:
# 1. Every push to main with conventional commits updates a "Release PR"
# 2. When you merge the Release PR, it:
#    - Updates version in package.json
#    - Updates CHANGELOG.md
#    - Creates a GitHub Release with tag
#    - Triggers the npm publish job below
#
# After a release, the docs-dispatch job asks automem-website to document it
# (docs on automem.ai follow published releases, not every push to main).
#
# Commit message format:
#   feat: add new feature          → minor version bump
#   fix: fix a bug                 → patch version bump
#   feat!: breaking change         → major version bump
#   chore/docs: no version bump
#
# npm Publishing:
#   Uses Trusted Publishing (OIDC) - no secrets needed!
#   Configure at: https://www.npmjs.com/package/@verygoodplugins/mcp-{name}/access
#
# Release PR token:
#   GitHub does not start workflow runs from events caused by GITHUB_TOKEN, so a
#   release PR opened with the default token lands with its checks in
#   `action_required` and has to be approved by hand before the required `test` and
#   `semantic-pr-title` checks can report. Three release PRs in a row stalled on
#   that. RELEASE_PLEASE_TOKEN (an org secret, visible to this repo) is used instead
#   so the PR's checks run on their own. It needs contents:write and
#   pull-requests:write. The token is probed before use and the workflow falls back
#   to github.token unless it authenticates, so a missing, expired, or revoked
#   secret still opens the release PR correctly - it just needs the manual approval
#   again, rather than failing the release outright. A `||` test alone is not
#   enough: an expired credential is still a non-empty string, so the expression
#   would select it and the job would die on authentication.

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # An unset secret is an empty string, but an expired or revoked one is not:
      # it stays truthy, so `secrets.X || github.token` would hand release-please a
      # dead credential and fail the job. Probe it and fall back unless it actually
      # authenticates. A false negative here costs only the manual approval this
      # change removes; selecting a dead token would block releases outright.
      - name: Check the release token authenticates
        id: token
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "No RELEASE_PLEASE_TOKEN configured; using GITHUB_TOKEN."
            echo 'usable=false' >> "$GITHUB_OUTPUT"
          elif gh api "repos/${REPO}/pulls" --silent >/dev/null 2>&1; then
            echo "RELEASE_PLEASE_TOKEN authenticates."
            echo 'usable=true' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RELEASE_PLEASE_TOKEN did not authenticate (expired, revoked, or lacking access). Falling back to GITHUB_TOKEN; the release PR's checks will need manual approval until the secret is repaired."
            echo 'usable=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # See "Release PR token" above: the default github.token would open a
          # release PR whose checks need manual approval.
          token: ${{ steps.token.outputs.usable == 'true' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docs-dispatch:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/docs-dispatch.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  npm-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Trusted Publishing: No NPM_TOKEN needed!
      - run: npm publish --access public --provenance

  # Build and upload Claude Desktop Extension (.mcpb) to release
  build-extension:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci
      - run: npm run build

      # Build the .mcpb Claude Desktop Extension
      - name: Build Claude Desktop Extension
        run: npx @anthropic-ai/mcpb pack

      # Upload .mcpb to the GitHub release
      - name: Upload Extension to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: '*.mcpb'
