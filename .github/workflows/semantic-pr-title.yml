name: Semantic PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  pull-requests: read

jobs:
  # One job, so exactly one check run is named `semantic-pr-title` on any commit.
  # The required status check resolves a duplicated context by the most recent run,
  # so a second job sharing this name would mask a genuinely invalid PR title.
  semantic-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            chore
            docs
            refactor
            test
            ci
            build
            perf
            revert
          requireScope: false

      - if: github.event_name == 'merge_group'
        run: echo 'PR title was validated before this merge-group run.'
